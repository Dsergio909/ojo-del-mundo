[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ojo-del-mundo"
version = "1.1.0"
description = "See a Minecraft Java world in 3D from its save files, and let Claude (or any MCP client) look at it, count blocks and read signs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sergio García" }]
dependencies = ["numpy>=1.24"]
keywords = ["minecraft", "mcp", "model-context-protocol", "claude", "renderer", "anvil", "nbt", "ai-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/Dsergio909/ojo-del-mundo"
Issues = "https://github.com/Dsergio909/ojo-del-mundo/issues"

[project.scripts]
ojo-mcp = "ojo.ojo_mcp:main"
ojo-view = "ojo.ver_mundo:main"

[tool.setuptools]
packages = ["ojo"]
