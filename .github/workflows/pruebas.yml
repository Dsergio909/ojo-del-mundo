name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python pruebas/probar.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Se instala con pip y los comandos arrancan
        run: |
          pip install .
          ojo-mcp --version
          ojo-view --help
      - name: Dibuja el mundo de prueba (sin PYTHONIOENCODING, como lo usa la gente)
        shell: bash
        run: |
          python pruebas/mundo_prueba.py mundo_ci
          ojo-view --world mundo_ci --x 12 --z 12 --radius 8 --out v.png > salida.txt
          test -s v.png
          cat salida.txt
          (cd "$RUNNER_TEMP" && python -m ojo --version)
